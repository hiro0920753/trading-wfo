[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-wfo"
version = "0.2.0"
description = "Walk-forward validation and optimization for trading strategies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hiro"}]
keywords = [
    "backtesting",
    "finance",
    "optimization",
    "trading",
    "walk-forward",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "optuna>=3.6",
    "rowlogger>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
trading-wfo = "trading_wfo.cli:main"

[project.urls]
Homepage = "https://github.com/hiro0920753/trading-wfo"
Documentation = "https://github.com/hiro0920753/trading-wfo#readme"
Issues = "https://github.com/hiro0920753/trading-wfo/issues"
Repository = "https://github.com/hiro0920753/trading-wfo"

[project.optional-dependencies]
test = ["httpx>=0.27"]
release = ["build>=1.2", "twine>=6.0"]

[tool.setuptools.package-data]
trading_wfo = ["dashboard/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
